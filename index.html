<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple tropical cocktail recipes with bright flavors and easy ingredients.">
  <title>Trader Jue | Simple Tropical Cocktails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a href="#top" class="logo">Trader Jue</a>

      <div class="nav-links">
        <a href="#recipes">Recipes</a>
      </div>
    </nav>
  </header>

  <main id="top">
    <section id="recipes" class="recipes-section container">
      <div class="section-heading">
        <div>
          <p class="eyebrow dark">Recipe list</p>
          <h2>Pick your favorite pour.</h2>
        </div>

        <input
          type="search"
          id="searchInput"
          class="search"
          placeholder="Search cocktails..."
          aria-label="Search cocktails"
        >
      </div>

      <div class="filter-buttons" aria-label="Filter recipes">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="rum">Rum</button>
        <button class="filter" data-filter="tequila">Tequila</button>
        <button class="filter" data-filter="vodka">Vodka</button>
      </div>

      <div id="recipeGrid" class="recipe-grid"></div>

      <p id="noResults" class="no-results" hidden>
        No cocktails found. Try another search.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <span>© 2026 Trader Jue</span>
      <span>Made for sunny days.</span>
    </div>
  </footer>

  <div id="recipeModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>

    <article class="modal-card">
      <button class="close-modal" data-close-modal aria-label="Close recipe">
        &times;
      </button>

      <div id="modalEmoji" class="modal-emoji" aria-hidden="true"></div>
      <p id="modalCategory" class="eyebrow"></p>
      <h2 id="modalTitle"></h2>
      <p id="modalDescription" class="modal-description"></p>

      <div class="recipe-details">
        <div>
          <h3>Ingredients</h3>
          <ul id="modalIngredients"></ul>
        </div>

        <div>
          <h3>Instructions</h3>
          <ol id="modalInstructions"></ol>
        </div>
      </div>

      <div class="garnish">
        <strong>Garnish:</strong>
        <span id="modalGarnish"></span>
      </div>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
